name: RESIDENZA CI (Backend & Frontend)

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Laravel Backend (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, sqlite3, pdo_sqlite, gd, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment & SQLite database
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Run PHPUnit test suite
        run: php artisan test

  frontend-build:
    name: Next.js Frontend (TypeCheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Build Next.js production bundle
        env:
          NEXT_PUBLIC_API_URL: ""
          NEXT_PUBLIC_BACKEND_URL: ""
          NEXT_PUBLIC_API_BASE_URL: "/api/v1"
          INTERNAL_BACKEND_URL: "http://127.0.0.1:8000"
        run: npm run build
